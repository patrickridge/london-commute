name: Commute alerts

# A backup for the main scheduler (cron-job.org, see the README): asks the site to send any commute
# alerts that are due. On a small repo GitHub runs this schedule only every few hours, so it can't be
# relied on alone.
on:
  schedule:
    - cron: "*/5 4-22 * * *" # every 5 minutes, 04:00 to 22:55 UTC
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    if: ${{ vars.ALERTS_URL != '' }}
    steps:
      - name: Send due alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALERTS_URL: ${{ vars.ALERTS_URL }}
        run: |
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$ALERTS_URL"
